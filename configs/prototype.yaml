data:
  root: /workspace/data/hecktor2026_crop96
  split_dir: /workspace/data/splits

  context_depth: 96
  num_orthogonal_slices: 1

  # temporary values
  # update these after running compute_stats.py
  ct_min: -1000.0
  ct_max: 1000.0
  pet_max: 25.0

  include_empty_slices: true


model:
  base_channels: 32
  latent_channels: 128
  context_dim: 128
  gate_channels: 32


loss:
  expected_weight: 0.5
  deviation_weight: 0.5
  gate_weight: 0.1
  gradient_weight: 0.1

  lesion_weight: 4.0

  blur_kernel: 15
  blur_sigma: 3.0

  gate_dilation: 7
  gate_sigma: 2.0


training:
  batch_size: 16
  num_workers: 8

  expected_epochs: 20
  full_epochs: 100

  expected_lr: 0.0001
  full_lr: 0.0001

  weight_decay: 0.00001

  seed: 42

  checkpoint_dir: /workspace/ct2pet/checkpoints
  output_dir: /workspace/ct2pet/outputs